<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCC - Информационная безопасность</title>
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #5288c1);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #708499);
            --card-bg: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
        p.subtitle { text-align: center; color: var(--hint-color); font-size: 14px; margin-top: 0; margin-bottom: 16px; }
        
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card-title { font-weight: 600; font-size: 16px; }
        .card-desc { font-size: 13px; color: var(--hint-color); }
        .card-price { font-size: 18px; font-weight: bold; margin-top: 4px; }
        
        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
    </style>
</head>
<body>

    <h1>Услуги SCC</h1>
    <p class="subtitle">Выберите нужную услугу по кибербезопасности</p>

    <div id="services-container">
        <!-- Услуги будут добавлены сюда через JavaScript -->
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Список услуг (цены в копейках, как требует Telegram)
        const services = [
            { id: "audit", title: "Аудит ИБ", desc: "Проверка инфраструктуры, отчёт", price: 50000 },
            { id: "pentest", title: "Пентест веб-приложения", desc: "Поиск уязвимостей, PoC", price: 100000 },
            { id: "soc", title: "SOC (месяц)", desc: "Мониторинг 24/7", price: 150000 },
            { id: "aware", title: "Обучение сотрудников", desc: "Курс по фишингу", price: 30000 },
            { id: "comply", title: "Аудит 152-ФЗ", desc: "Проверка персональных данных", price: 70000 }
        ];

        const container = document.getElementById('services-container');

        // Отрисовываем карточки
        services.forEach(service => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Форматируем цену (например, 50000 -> 50 000 ₽)
            const formattedPrice = new Intl.NumberFormat('ru-RU').format(service.price) + ' ₽';

            card.innerHTML = `
                <div class="card-title">${service.title}</div>
                <div class="card-desc">${service.desc}</div>
                <div class="card-price">${formattedPrice}</div>
                <button onclick="buyService('${service.id}', '${service.title}', ${service.price})">
                    Заказать
                </button>
            `;
            container.appendChild(card);
        });

        // Функция, которая срабатывает при нажатии "Заказать"
        function buyService(id, title, price) {
            // Отправляем данные боту
            tg.sendData(JSON.stringify({
                action: "buy",
                service_id: id,
                title: title,
                price: price
            }));
            // Закрываем мини-приложение после отправки (опционально)
            // tg.close(); 
        }
    </script>
</body>
</html>
