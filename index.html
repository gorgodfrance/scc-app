<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCC // TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');

        :root {
            --bg-color: #050505;
            --text-color: #00ff41;
            --text-dim: #007a1f;
            --card-bg: #0a0a0a;
            --header-bg: #111111;
        }

        body {
            font-family: 'Fira Code', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            background-image: linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .company-header { background-color: var(--header-bg); border-bottom: 1px solid var(--text-dim); padding: 15px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 100; }
        .company-logo { width: 40px; height: 40px; background: var(--bg-color); border: 1px solid var(--text-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .company-info h2 { margin: 0; font-size: 16px; color: #fff; text-transform: uppercase; }
        .company-info p { margin: 2px 0 0; font-size: 10px; color: var(--text-dim); }

        .content { padding: 16px; flex-grow: 1; overflow-y: auto; padding-bottom: 80px; }

        .screen { display: none; height: 100%; flex-direction: column; }
        .screen.active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .hero-section { position: relative; border: 1px solid var(--text-dim); margin-bottom: 20px; }
        .hero-img { width: 100%; height: 120px; object-fit: cover; opacity: 0.6; }
        .hero-text { position: absolute; bottom: 0; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); width: 100%; box-sizing: border-box; }
        .hero-text h3 { margin: 0; font-size: 14px; color: var(--text-color); }
        .hero-text p { margin: 5px 0 0; font-size: 10px; color: #ccc; }

        .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--text-dim); border-top: 3px solid var(--text-color); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { box-shadow: 0 0 15px rgba(0, 255, 65, 0.3); }
        .card-img { width: 100%; height: 80px; object-fit: cover; opacity: 0.7; }
        .card-content { padding: 10px; }
        .card-title { font-size: 12px; color: #fff; }
        .card-price { font-size: 14px; font-weight: bold; color: var(--text-color); margin-top: 8px; }

        .back-btn { background: none; border: none; color: var(--text-dim); font-family: inherit; font-size: 14px; cursor: pointer; margin-bottom: 15px; padding: 0; }
        .detail-img { width: 100%; height: 180px; object-fit: cover; border: 1px solid var(--text-dim); }
        .detail-title { font-size: 20px; margin: 15px 0 5px; color: #fff; }
        .detail-price { font-size: 24px; color: var(--text-color); margin-bottom: 15px; font-weight: bold; }
        .detail-desc { font-size: 13px; color: #ccc; line-height: 1.5; margin-bottom: 20px; }

        button { background: transparent; color: var(--text-color); border: 1px solid var(--text-color); padding: 14px; font-size: 15px; font-family: inherit; font-weight: 600; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.2s; margin-bottom: 10px; }
        button:hover { background: var(--text-color); color: var(--bg-color); box-shadow: 0 0 15px var(--text-color); }
        button.support { border: 1px dashed #555; color: #fff; text-transform: none; }
        button.support:hover { border-color: #fff; background: rgba(255,255,255,0.05); }

        .main-support-btn { display: block; text-align: center; text-decoration: none; border: 1px dashed var(--text-color); color: var(--text-color); padding: 15px; font-weight: 600; margin-top: 10px; transition: 0.2s; }
        .main-support-btn:hover { background: rgba(0, 255, 65, 0.1); box-shadow: 0 0 10px var(--text-dim); }

        #chat-screen { background: var(--bg-color); z-index: 200; position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
        .chat-header-bar { padding: 10px 16px; border-bottom: 1px solid var(--text-dim); display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); }
        .chat-header-bar span { color: #fff; font-size: 14px; }
        
        .chat-messages { flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; font-size: 13px; border-radius: 4px; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: rgba(0, 255, 65, 0.1); border: 1px solid var(--text-dim); color: #fff; }
        .msg.admin { align-self: flex-start; background: var(--header-bg); border: 1px solid #333; color: var(--text-color); }
        
        .chat-input-area { padding: 10px; background: var(--header-bg); border-top: 1px solid var(--text-dim); display: flex; gap: 10px; }
        .chat-input-area input { flex-grow: 1; background: #000; border: 1px solid var(--text-dim); color: #fff; padding: 10px; font-family: inherit; outline: none; }
        .chat-input-area button { width: auto; margin: 0; padding: 10px 15px; font-size: 13px; }

        .btn-close-chat { background: transparent; border: 1px solid var(--text-color); color: var(--text-color); padding: 5px 10px; font-size: 12px; margin: 0; width: auto; }
        .btn-close-chat:hover { background: var(--text-color); color: var(--bg-color); }
        
        .btn-end-chat { background: transparent; border: 1px solid #ff3333; color: #ff3333; padding: 5px 10px; font-size: 12px; margin: 0; width: auto; }
        .btn-end-chat:hover { background: #ff3333; color: #fff; box-shadow: 0 0 10px #ff3333; }
    </style>
</head>
<body>

    <header class="company-header">
        <div class="company-logo">SCC</div>
        <div class="company-info"><h2>SCC Terminal</h2><p>Secure Line</p></div>
    </header>

    <div class="content">
        <div id="catalog-screen" class="screen active">
            <div class="hero-section">
                <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800" class="hero-img">
                <div class="hero-text">
                    <h3>О компании</h3>
                    <p>Команда этичных хакеров и экспертов по кибербезопасности.</p>
                </div>
            </div>
            <div class="catalog-grid" id="services-container"></div>
            <div class="main-support-btn" onclick="openChat()">💬 Связаться с техподдержкой</div>
        </div>

        <div id="detail-screen" class="screen">
            <button class="back-btn" onclick="showCatalog()">← Назад в каталог</button>
            <img id="d-image" class="detail-img">
            <h2 id="d-title" class="detail-title"></h2>
            <div id="d-price" class="detail-price"></div>
            <div id="d-desc" class="detail-desc"></div>
            <button id="d-buy-btn" onclick="buyCurrent()">Выполнить (Оплатить)</button>
            <button class="support" onclick="openChat()">💬 Чат с менеджером</button>
        </div>

        <div id="chat-screen" class="screen">
            <div class="chat-header-bar">
                <span>Чат с поддержкой</span>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-end-chat" onclick="endChat()">Завершить</button>
                    <button class="btn-close-chat" onclick="closeChat()">Закрыть</button>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Введите сообщение...">
                <button onclick="sendChatMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#050505');
        
        // Для теста на ПК
        const API_URL = 'http://localhost:8080'; 
        // Если тестируешь с телефона, замени localhost на IP компа (например, 192.168.1.5)

        let currentServiceId = "";
        let currentServiceTitle = "";
        let currentServicePrice = 0;
        let chatInterval;

        const services = [
            { id: "audit", title: "AUDIT_IB", price: 50000, img: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=800", full: "Глубокий аудит инфраструктуры." },
            { id: "pentest", title: "PENTEST_WEB", price: 100000, img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800", full: "Тестирование на проникновение." },
            { id: "soc", title: "SOC_MONITOR", price: 150000, img: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=800", full: "Мониторинг 24/7." },
            { id: "aware", title: "EDU_PHISH", price: 30000, img: "https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=800", full: "Обучение сотрудников." },
            { id: "comply", title: "COMPLY_152FZ", price: 70000, img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=800", full: "Аудит 152-ФЗ." },
            { id: "redteam", title: "RED_TEAM", price: 200000, img: "https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?q=80&w=800", full: "Имитация атаки." },
            { id: "codeaudit", title: "CODE_AUDIT", price: 80000, img: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=800", full: "Аудит кода." },
            { id: "forensics", title: "FORENSICS", price: 120000, img: "https://images.unsplash.com/photo-1563986768609-322da13575f3?q=80&w=800", full: "Криминалистика." }
        ];

        const container = document.getElementById('services-container');
        services.forEach(s => {
            const price = new Intl.NumberFormat('ru-RU').format(s.price) + ' ₽';
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => showDetail(s);
            card.innerHTML = `<img src="${s.img}" class="card-img"><div class="card-content"><div class="card-title">[${s.title}]</div><div class="card-price">${price}</div></div>`;
            container.appendChild(card);
        });

        function showDetail(service) {
            currentServiceId = service.id;
            currentServiceTitle = service.title;
            currentServicePrice = service.price;
            document.getElementById('d-image').src = service.img;
            document.getElementById('d-title').innerText = service.title;
            document.getElementById('d-price').innerText = new Intl.NumberFormat('ru-RU').format(service.price) + ' ₽';
            document.getElementById('d-desc').innerText = service.full;
            document.getElementById('catalog-screen').classList.remove('active');
            document.getElementById('detail-screen').classList.add('active');
        }

        function showCatalog() {
            document.getElementById('detail-screen').classList.remove('active');
            document.getElementById('catalog-screen').classList.add('active');
        }

        function buyCurrent() {
            tg.sendData(JSON.stringify({ action: "buy", service_id: currentServiceId, title: currentServiceTitle, price: currentServicePrice }));
            tg.close();
        }

        // --- ЧАТ ---
        function openChat() {
            document.getElementById('catalog-screen').classList.remove('active');
            document.getElementById('detail-screen').classList.remove('active');
            document.getElementById('chat-screen').classList.add('active');
            
            const container = document.getElementById('chat-messages');
            container.innerHTML = ''; 
            
            loadMessages();
            chatInterval = setInterval(loadMessages, 2000); 
        }

        function closeChat() {
            clearInterval(chatInterval);
            document.getElementById('chat-screen').classList.remove('active');
            document.getElementById('catalog-screen').classList.add('active');
        }

        async function endChat() {
            const userId = tg.initDataUnsafe?.user?.id;
            if (!userId) return;

            if(confirm("Вы уверены, что хотите завершить диалог? История будет очищена.")) {
                try {
                    await fetch(`${API_URL}/api/end`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId })
                    });
                    document.getElementById('chat-messages').innerHTML = '';
                    openChat(); 
                } catch (e) {
                    console.error("Ошибка завершения", e);
                }
            }
        }

        async function loadMessages() {
            try {
                const userId = tg.initDataUnsafe?.user?.id;
                if (!userId) return;

                const response = await fetch(`${API_URL}/api/messages?user_id=${userId}`);
                const messages = await response.json();
                
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';

                if (messages.length === 0) {
                    const welcome = document.createElement('div');
                    welcome.className = 'msg admin';
                    welcome.innerText = "Здравствуйте! Вы подключились к защищенной линии поддержки SCC. Напишите ваш вопрос, и менеджер ответит здесь.";
                    container.appendChild(welcome);
                } else {
                    messages.forEach(m => {
                        const div = document.createElement('div');
                        div.className = `msg ${m.is_admin ? 'admin' : 'user'}`;
                        div.innerText = m.text;
                        container.appendChild(div);
                    });
                }
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error("Ошибка загрузки сообщений", e);
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            const userId = tg.initDataUnsafe?.user?.id;
            
            if (!text || !userId) return;
            input.value = "";

            // 1. Мгновенно показываем сообщение клиента (чтобы не ждать 2 секунды)
            const container = document.getElementById('chat-messages');
            const tempMsg = document.createElement('div');
            tempMsg.className = 'msg user';
            tempMsg.innerText = text;
            container.appendChild(tempMsg);
            container.scrollTop = container.scrollHeight;

            try {
                // 2. Отправляем на сервер
                await fetch(`${API_URL}/api/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, text: text })
                });
                
                // 3. Сразу подгружаем новые сообщения (включая автоответ)
                loadMessages();
            } catch (e) {
                console.error("Ошибка отправки", e);
            }
        }
    </script>
</body>
</html>
