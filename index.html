<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCC // TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');

        :root {
            --bg-color: #050505; /* Глубокий черный */
            --text-color: #00ff41; /* Матричный зеленый */
            --text-dim: #007a1f;
            --border-color: #00ff41;
            --card-bg: #0a0a0a;
        }

        body {
            font-family: 'Fira Code', monospace; /* Шрифт терминала */
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* Эффект матричной сетки на фоне */
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Заголовок */
        .header {
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--text-dim);
            padding-bottom: 10px;
        }
        h1 { 
            font-size: 22px; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--text-color), 0 0 10px var(--text-dim);
        }
        p.subtitle { 
            color: var(--text-dim); 
            font-size: 12px; 
            margin-top: 5px; 
            margin-bottom: 0;
        }

        /* Карточки */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--text-dim);
            border-left: 4px solid var(--text-color);
            padding: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            border-color: var(--text-color);
        }

        /* Эффект сканирования */
        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.3);
            animation: scan 3s infinite linear;
        }
        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .card-title { 
            font-weight: 600; 
            font-size: 16px; 
            color: #ffffff;
            text-shadow: 0 0 5px var(--text-color);
        }
        .card-desc { 
            font-size: 12px; 
            color: var(--text-dim); 
            margin: 6px 0;
        }
        .card-price { 
            font-size: 20px; 
            font-weight: bold; 
            color: var(--text-color);
            margin-top: 8px;
        }

        /* Кнопки */
        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 12px;
            font-size: 14px;
            font-family: 'Fira Code', monospace;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            box-shadow: inset 0 0 0 0 var(--text-color);
        }

        button::before {
            content: '> ';
            opacity: 0;
            transition: 0.2s;
        }

        button:hover, button:active {
            background-color: var(--text-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--text-color);
        }
        
        button:hover::before {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SECURITY CYBER CENTER</h1>
        <p class="subtitle">// [ ДОСТУП РАЗРЕШЕН ] ВЫБЕРИТЕ ПРОТОКОЛ</p>
    </div>

    <div id="services-container">
        <!-- Услуги будут добавлены сюда через JavaScript -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Если в Телеграме включена темная тема, делаем шапку темной
        tg.setHeaderColor('#050505');

        const services = [
            { id: "audit", title: "AUDIT_IB", desc: "Проверка инфраструктуры, отчёт", price: 50000 },
            { id: "pentest", title: "PENTEST_WEB", desc: "Поиск уязвимостей, PoC", price: 100000 },
            { id: "soc", title: "SOC_MONITORING", desc: "Мониторинг 24/7", price: 150000 },
            { id: "aware", title: "EDU_PHISHING", desc: "Курс по фишингу", price: 30000 },
            { id: "comply", title: "COMPLY_152FZ", desc: "Проверка персональных данных", price: 70000 }
        ];

        const container = document.getElementById('services-container');

        services.forEach(service => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const formattedPrice = new Intl.NumberFormat('ru-RU').format(service.price) + ' ₽';

            card.innerHTML = `
                <div class="card-title">[${service.title}]</div>
                <div class="card-desc">${service.desc}</div>
                <div class="card-price">${formattedPrice}</div>
                <button onclick="buyService('${service.id}', '${service.title}', ${service.price})">
                    Выполнить
                </button>
            `;
            container.appendChild(card);
        });

        function buyService(id, title, price) {
            tg.sendData(JSON.stringify({
                action: "buy",
                service_id: id,
                title: title,
                price: price
            }));
        }
    </script>
</body>
</html>
